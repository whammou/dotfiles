      - key: "9"
        desc: "󰍉 Floating 9"
        cmd: "qtlcmd -o layout -f focus_nth_floating -a 8"
      - key: "s"
        desc: " Spawn Float"
        cmd: "qtlcmd -o layout -f spawn_float -a 'wlr-which-key '"
      - key: "minus"
        desc: "Shrink Floating -5%"
        cmd: "qtlcmd -o layout -f grow_window_maintain_aspect_ratio -a 0.95"
      - key: "f"
        desc: "Toggle Fullscreen"
        cmd: "qtlcmd -o window -f toggle_fullscreen"
      - key: "n"
        desc: "Focus Next Floating"
        cmd: "qtlcmd -o layout -f focus_next_floating"
      - key: "p"
        desc: "Focus Prev Floating"
        cmd: "qtlcmd -o layout -f focus_prev_floating"
      - key: "t"
        desc: "Toggle Floating"
        cmd: "qtlcmd -o layout -f toggle_floating"
      - key: "q"
        desc: "Kill Window"
        cmd: "qtlcmd -o window -f kill"
      - key: "u"
        desc: "Pull Floating To Tab"
        cmd: "qtlcmd -o layout -f pull_floating_to_tab"
  # }}}
  - key: "r"
    desc: "Reload Config"
    cmd: "qtlcmd -o core -f reload_config"
