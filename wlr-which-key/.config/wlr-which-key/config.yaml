font: "HasklugNerdFont 13"
background: "#31353f"
color: "#abb2bf"
border: "#98c379"
separator: "    ➜ "
border_width: 2
corner_r: 0
padding: 10
rows_per_column: 6
column_padding: 25
anchor: bottom
inhibit_compositor_keyboard_shortcuts: true
auto_kbd_layout: true

menu:
  # Floating Mode: {{{
  - key: "f"
    desc: "Floating Mode"
    submenu:
      - key: "equal"
        desc: "Grow Floating +5%"
        cmd: "qtlcmd -o layout -f grow_window_maintain_aspect_ratio -a 1.05"
      # - key: "f"
      #   desc: "󰍉 Focus Floating"
      #   submenu:
      - key: "1"
        desc: "󰍉 Floating 1"
        cmd: "qtlcmd -o layout -f focus_nth_floating -a 0"
      - key: "2"
        desc: "󰍉 Floating 2"
        cmd: "qtlcmd -o layout -f focus_nth_floating -a 1"
      - key: "3"
        desc: "󰍉 Floating 3"
        cmd: "qtlcmd -o layout -f focus_nth_floating -a 2"
      - key: "4"
        desc: "󰍉 Floating 4"
        cmd: "qtlcmd -o layout -f focus_nth_floating -a 3"
      - key: "5"
