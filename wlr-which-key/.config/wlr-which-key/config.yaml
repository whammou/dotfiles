            cmd: 'qtlcmd -o layout -f eval -a ''self.merge_to_subtab("down")'''
      - key: "o"
        desc: "Pull Out"
        cmd: 'qtlcmd -o layout -f eval -a ''self.pull_out(position="next")'''
      - key: "s"
        desc: " Spawn Split"
        cmd: "qtlcmd 'wlr-which-key '"
      - key: "t"
