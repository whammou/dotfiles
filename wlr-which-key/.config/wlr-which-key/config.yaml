            cmd: "qtlcmd -o layout -f spawn_split -a 'wlr-which-key ' -a x -k position=previous"
          - key: "j"
            desc: "󰤻 Split Down"
            cmd: "qtlcmd -o layout -f spawn_split -a 'wlr-which-key ' -a y"
          - key: "k"
            desc: "󰤻 Split Above"
            cmd: "qtlcmd -o layout -f spawn_split -a 'wlr-which-key ' -a y -k position=previous"
          - key: "l"
            desc: "󰤼 Split Right"
            cmd: "qtlcmd -o layout -f spawn_split -a 'wlr-which-key ' -a x"
      - key: "f"
