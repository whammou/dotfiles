        cmd: "qtlcmd -o window -f toggle_fullscreen"
      - key: "m"
        desc: "Merge Windows"
        submenu:
          - key: "h"
            desc: "Merge Subtab Left"
            cmd: 'qtlcmd -o layout -f eval -a ''self.merge_to_subtab("left")'''
          - key: "l"
            desc: "Merge Subtab Right"
            cmd: 'qtlcmd -o layout -f eval -a ''self.merge_to_subtab("right")'''
          - key: "k"
