font: "HasklugNerdFont 13"
background: "#31353f"
color: "#abb2bf"
border: "#98c379"
separator: "    ➜ "
border_width: 2
corner_r: 0
padding: 15
rows_per_column: 6
column_padding: 25
anchor: bottom
inhibit_compositor_keyboard_shortcuts: false
auto_kbd_layout: true

menu:
  - key: "f"
    desc: "Hint click"
    cmd: "wl-kbptr -o modes=click,floating -o mode_floating.source=detect"
  - key: "F"
    desc: "Hint hover"
    cmd: "wl-kbptr -o modes=floating -o mode_floating.source=detect"
