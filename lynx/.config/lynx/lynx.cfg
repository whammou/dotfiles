INCLUDE:/etc/lynx/lynx.cfg

VI_KEYS_ALWAYS_ON:TRUE
DEFAULT_USER_MODE:ADVANCED

SET_COOKIES:TRUE
ACCEPT_ALL_COOKIES:FALSE

MAKE_LINKS_FOR_ALL_IMAGES:TRUE

DEFAULT_EDITOR:nvim
EXTERNAL:http:xdg-open %s

KEYMAP:^U:UP_HALF		# Move display up half a page
KEYMAP:^D:DOWN_HALF		# Move display down half a page


KEYMAP:O:EXTERN_PAGE		# Run external program with current page
KEYMAP:o:EXTERN_LINK		# Run external program with current link

