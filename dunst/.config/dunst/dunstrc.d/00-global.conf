[global]
# monitor: {{{
monitor = 0
follow = mouse
# }}}

# dimensions: {{{
width = 425
height = (0, 300)
offset = (25,63)
gap_size = 18
transparency = 0
origin = top-right
# }}}

# visibility: {{{
indicate_hidden = yes
shrink = yes
separator_height = 0
separator_color = auto
# }}}

# spacing: {{{
padding = 20
horizontal_padding = 20
frame_width = 2
# }}}

# behavior: {{{
sort = id
idle_threshold = 3
show_age_threshold = -1
notification_limit = 6
# }}}

# text: {{{
font = HasklugNerdFont 13
line_height = 0
markup = full
word_wrap = yes
ignore_newline = no
alignment = left
# }}}

# duplicates: {{{
stack_duplicates = true
hide_duplicate_count = false
show_indicators = true
# }}}

# icons: {{{
# default_icon = /usr/share/icons/Suru++-Asprómauros/actions/16/dialog-information.svg
# icon_theme = Suru++-Asprómauros
icon_position = off
max_icon_size = 48
enable_recursive_icon_lookup = true
enable_posix_regex = true
# }}}

# history: {{{
sticky_history = yes
history_length = 0
# }}}

# applications: {{{
browser = /usr/sbin/qutebrowser
always_run_script = true
title = Dunst
class = Dunst

dmenu = /usr/sbin/rofi -dmenu -i -p dunst
#mouse_left_click=view
#context = ctrl+period
# }}}

# progress: {{{
progress_bar = true
progress_bar_height = 10
progress_bar_frame_width = 1
progress_bar_min_width = 150
progress_bar_max_width = 400
# }}}

# colors: {{{
background = "#282c34"
foreground = "#abb2bf"
# }}}

# vim:foldmethod=marker
