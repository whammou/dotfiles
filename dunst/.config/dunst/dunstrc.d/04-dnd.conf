# Do-not-disturb tiers via pause levels
# Importance (most → least): critical -> system -> terminal -> reminder -> media -> conversation
#
# A notification shows iff its override_pause_level >= global pause level.
# Toggle with: dunstctl set-pause-level <N>  (or scripts/dnd-mode <tier>)
#   0   = off, everything shows
#   15  = mute conversation (chat / AI / mail)
#   25  = + mute media (music, clipboard, transient)
#   45  = + mute reminders (orgmode, clock)
#   65  = + mute terminal (remote session, fish, opencode)
#   85  = only critical (calls, critical urgency)
#   100 = only critical (fully paused, same as `dunstctl set-paused true`)
#
# These rules match display-* notifications (post notification-format pipeline).
# Category comes from senders or is normalized in 03-notify-rules.conf
# (set_category = dnd.*); summary/appname fallbacks cover senders w/o category.
# [dnd-default] is first so every specific tier below overrides it.

[dnd-default]
    appname = ^display-
    override_pause_level = 50

[dnd-critical-calls]
    category = call.request|call.missed|call.accept.notification
    override_pause_level = 100

[dnd-critical-urgency]
    appname = ^display-
    msg_urgency = critical
    override_pause_level = 100

[dnd-system]
    category = dnd.system
    override_pause_level = 80

[dnd-system-fallback]
    appname = ^display-System$
    override_pause_level = 80

[dnd-system-battery-update]
    appname = ^display-
    summary = ^AccuBattery$|Google Play Store
    override_pause_level = 80

[dnd-terminal]
    category = dnd.terminal
    override_pause_level = 60

[dnd-terminal-fallback]
    appname = ^display-
    summary = RemoteSession|Terminal|Remote Warning|^Done in|^Failed|OpenCode
    override_pause_level = 60

[dnd-reminder]
    category = dnd.reminder|reminder
    override_pause_level = 40

[dnd-reminder-fallback]
    appname = ^display-
    summary = ^(Orgmode|Reminder|Clock)$
    override_pause_level = 40

[dnd-media]
    category = dnd.media
    override_pause_level = 20

[dnd-media-fallback]
    appname = ^display-
    summary = clipboard|Clipboard|SimpMusic|NewPipe|Pocket Casts|Mpv|zapdf
    override_pause_level = 20

[dnd-conversation]
    category = dnd.conversation
    override_pause_level = 10

[dnd-conversation-fallback]
    appname = ^display-
    summary = Beeper$|Zalo$|Discord$|Spark$|Neomutt$|Fabric$
    override_pause_level = 10

