# ntfy: {{{
[nfty]
appname = ntfy
format = ""
set_category = "ntfy-script"
script = ~/.config/dunst/scripts/notification-format

[ntfy-default]
category = ntfy-display
frame_color = "#54b0fd"
highlight = "#54b0fd"
format = "<b><span foreground='#54b0fc' >  %s</span></b>\n\n%b"
# }}}

# clipboard: {{{
[clipboard]
category = ntfy-display
summary = clipboard
set_stack_tag = string:x-dunst-stack-tag:clipboard
script = ~/.config/dunst/scripts/clipboard-action

[clipboard-action]
summary = Clipboard
frame_color = "#54b0fd"
highlight = "#54b0fd"
format = "<b><span foreground='#54b0fc' >󰛈  %s</span></b>\n\n%b"
set_stack_tag = string:x-dunst-stack-tag:clipboard
# }}}

# media: {{{
[ntfy-media]
category = ntfy-display
summary = SimpMusic|NewPipe|Pocket\ Casts
frame_color = "#efbd5d"
highlight = "#efbd5d"
format = "<b><span foreground='#efbd5d' >󰨜  %s</span></b>\n\n%b"
timeout = 3
set_transient = yes
set_stack_tag = string:x-dunst-stack-tag:media
history_ignore = yes

[mpv]
summary = Mpv
frame_color = "#efbd5d"
highlight = "#efbd5d"
format = "<b><span foreground='#efbd5d' >󰨜  %s</span></b>\n\n%b"
timeout = 3
set_transient = yes
set_stack_tag = string:x-dunst-stack-tag:media
history_ignore = yes
# }}}

# reminder: {{{
[clock]
category = ntfy-display
summary = Clock
body = ^<b></b>:$
format = ""
script = ~/.config/dunst/scripts/clock-format

[reminder]
category = ^(ntfy-display|reminder)$
summary = ^(Orgmode|Reminder)$
format = "<b><span foreground='#34bfd0' >󰕪  %s</span></b>\n\n%b"
frame_color = "#34bfd0"
highlight = "#34bfd0"

[orgmode-update-flag]
category = ntfy-display
summary = ^orgmode-actions-sync$
script = ~/.config/dunst/scripts/webdav-sync
format = ""
set_transient = yes
timeout = 1

[update]
category = ntfy-display
summary = Google Play Store
format = "<b><span foreground='#8bcd5b' >󰚰  %s</span></b>\n\n%b"
frame_color = "#8bcd5b"
highlight = "#8bcd5b"
# }}}

# Misc: {{{
[terminal]
#category = ntfy-display
summary = RemoteSession|Terminal
frame_color = "#8bcd5b"
highlight = "#8bcd5b"
format = "<b><span foreground='#8bcd5b' >  %s</span></b>\n\n%b"

[opencode]
category = ntfy-display
summary = OpenCode
frame_color = "#8bcd5b"
highlight = "#8bcd5b"
format = "<b><span foreground='#8bcd5b' >  %s</span></b>\n\n%b"

[terminal-warning]
category = ntfy-display
summary = Remote Warning
frame_color = "#efbd5d"
highlight = "#efbd5d"
format = "<b><span foreground='#efbd5d' >  %s</span></b>\n\n%b"

[fish]
appname = fish
set_transient = no
history_ignore = yes

[mail]
category = ntfy-display
summary = Spark
frame_color = "#dd9046"
highlight = "#dd9046"
format = "<b><span foreground='#dd9046' >  %s</span></b>\n\n%b"

[conversation]
category = ntfy-display
summary = Beeper$|Zalo$
frame_color = "#c75ae8"
highlight = "#c75ae8"
format = "<b><span foreground='#c75ae8' >󰭻  %s</span></b>\n\n%b"

[ai-conversation]
category = ntfy-display
summary = Fabric$
frame_color = "#c75ae8"
highlight = "#c75ae8"
format = "<b><span foreground='#c75ae8' >󰧑  %s</span></b>\n\n%b"
history_ignore = yes
# }}}

# calls: {{{
[call]
category = ntfy-display
summary = Zalo$|Phone$|Meet$
body = ".* Incoming( voice| video|)? call$"
format = ""
set_stack_tag = string:x-dunst-stack-tag:call
script = ~/.config/dunst/scripts/call-action

[call-action]
category = call.request
frame_color = "#54b0fd"
highlight = "#54b0fd"
format = "<b><span foreground='#54b0fc' >󰏷  %s</span></b>\n\n%b"
set_stack_tag = string:x-dunst-stack-tag:call
history_ignore = yes
set_transient = yes
timeout = 10

[call-calling]
category = ntfy-display
summary = Zalo$|Phone$
body = .* Calling(\.\.\.| )?$
frame_color = "#54b0fd"
highlight = "#54b0fd"
format = "<b><span foreground='#54b0fc' >󰏻  %s</span></b>\n\n%b"
set_transient = yes
history_ignore = yes

[call-missed]
category = ntfy-display
summary = Zalo$|Phone$|Meet$
body = ^<b>(\[Missed (audio|video) call\]|Missed call)</b>: (.+)$
set_category = "call.missed"
frame_color = "#f65866"
highlight = "#f65866"
format = "<b><span foreground='#f65866' >󰏺  %s</span></b>\n\n%b"
timeout = 0

[calls-missed]
category = ntfy-display
summary = Zalo$|Phone$
body = ^<b>Missed calls</b>: (.+)$
set_category = "call.missed"
frame_color = "#f65866"
highlight = "#f65866"
format = "<b><span foreground='#f65866' >󰏺  %s</span></b>\n\n%b"
history_ignore = yes
set_transient = yes
timeout = 5

[call-accept]
category = ntfy-display
summary = Zalo$|Phone$
body = "^<b></b>:$|^.*: Ongoing call$"
format = ""
set_stack_tag = string:x-dunst-stack-tag:call
script = ~/.config/dunst/scripts/confirm-pickup
history_ignore = yes

[call-accept-format]
category = call.accept.notification
summary = Zalo$|Phone$
body = ^Call in progress$
frame_color = "#8bcd5b"
highlight = "#8bcd5b"
format = "<b><span foreground='#8bcd5b' >󰏶  %s</span></b>\n\n%b"
set_stack_tag = string:x-dunst-stack-tag:call
history_ignore = yes
set_transient = yes
timeout = 10

[hidden]
summary = Phone Action
format = ""
# }}}

# Sound: {{{
[sound]
summary = ".*"
script = ~/.config/dunst/scripts/sound-dispatcher
# }}}

