# calls: {{{
[call]
category = ntfy-display
summary = Zalo$|Phone$|Meet$
body = ".* Incoming( voice| video|)? call$"
format = ""
set_category = "raw.handled"
set_stack_tag = string:x-dunst-stack-tag:call
script = ~/.config/dunst/scripts/call-action

[call-action]
category = call.request
frame_color = "#73b8f1"
highlight = "#73b8f1"
format = "<b><span foreground='#73b8f1' >󰏷  %s</span></b>\n\n%b"
set_stack_tag = string:x-dunst-stack-tag:call
history_ignore = yes
set_transient = yes
timeout = 10

[call-calling]
category = ntfy-display
summary = Zalo$|Phone$
body = .* Calling(\.\.\.| )?$
frame_color = "#73b8f1"
highlight = "#73b8f1"
format = "<b><span foreground='#73b8f1' >󰏻  %s</span></b>\n\n%b"
set_transient = yes
history_ignore = yes

[call-missed]
category = ntfy-display
summary = Zalo$|Phone$|Meet$
body = ^<b>(\[Missed (audio|video) call\]|Missed call)</b>: (.+)$
set_category = "call.missed"
frame_color = "#e86671"
highlight = "#e86671"
format = "<b><span foreground='#e86671' >󰏺  %s</span></b>\n\n%b"
timeout = 0

[calls-missed]
category = ntfy-display
summary = Zalo$|Phone$
body = ^<b>Missed calls</b>: (.+)$
set_category = "call.missed"
frame_color = "#e86671"
highlight = "#e86671"
format = "<b><span foreground='#e86671' >󰏺  %s</span></b>\n\n%b"
history_ignore = yes
set_transient = yes
timeout = 5

[call-accept]
category = ntfy-display
summary = Zalo$|Phone$
body = "^<b></b>:$|^.*: Ongoing call$"
format = ""
set_category = "raw.handled"
set_stack_tag = string:x-dunst-stack-tag:call
script = ~/.config/dunst/scripts/confirm-pickup
history_ignore = yes

[call-accept-format]
category = call.accept.notification
summary = Zalo$|Phone$
body = ^Call in progress$
frame_color = "#98c379"
highlight = "#98c379"
format = "<b><span foreground='#98c379' >󰏶  %s</span></b>\n\n%b"
set_stack_tag = string:x-dunst-stack-tag:call
history_ignore = yes
set_transient = yes
timeout = 10

[hidden]
summary = Phone Action
format = ""
