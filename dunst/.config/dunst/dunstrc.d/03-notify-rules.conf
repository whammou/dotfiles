# Pipeline: raw → display notification separation
# Every notification passes through [raw-notification] (hidden + enriched).
# The enrichment script re-sends with appname=display-<original>.
# skip_display (not format="") hides the original while still returning a
# valid D-Bus ID to the sender — format="" makes dunst reply id 0, which
# breaks qutebrowser's libnotify adapter ("Got invalid notification id 0").
# Specific rules below override with rich formatting.
#
# Order matters:
#   1. [raw-notification]  — skip_display hides, script enriches
#   2. [display-pass]      — format non-empty so display- notifications show
#   3. Specific rules      — override with rich per-app formatting

[raw-notification]
    appname = ".*"
    skip_display = yes
    history_ignore = yes
    script = ~/.config/dunst/scripts/notification-format

[display-pass]
    appname = ^display-
    skip_display = no
    history_ignore = no
    format = "<b>%s</b>\n\n%b"
    set_transient = no

[display-urg-low]
    appname = ^display-
    msg_urgency = low
    format = "<b><span foreground='#e5c07b' >  %s</span></b>\n\n%b"

[display-urg-normal]
    appname = ^display-
    msg_urgency = normal
    format = "<b><span foreground='#56b6c2' >  %s</span></b>\n\n%b"

[display-urg-crit]
    appname = ^display-
    msg_urgency = critical
    format = "<b><span foreground='#e86671' >  %s</span></b>\n\n%b"

[display-qutebrowser]
appname = ^display-qutebrowser$
frame_color = "#56b6c2"
highlight = "#56b6c2"
format = "<b><span foreground='#56b6c2' >󰖟  %s</span></b>\n\n%b"
set_category = "dnd.conversation"

[ntfy-default]
appname = ^display-ntfy$
frame_color = "#73b8f1"
highlight = "#73b8f1"
format = "<b><span foreground='#73b8f1' >  %s</span></b>\n\n%b"
# }}}

