# Pipeline: raw → display notification separation
# Every notification passes through [raw-notification] (suppressed + enriched).
# The enrichment script re-sends with appname=dis+<original> + category=ntfy-display.
# [display-pass] ensures display notifications are NOT suppressed by format="".
# Specific rules below override with rich formatting.
#
# Order matters:
#   1. [raw-notification]  — format="" suppresses, script enriches
#   2. [display-pass]      — format non-empty so dis+ notifications show
#   3. Specific rules      — override with rich per-app formatting

[raw-notification]
    appname = ".*"
    format = ""
    script = ~/.config/dunst/scripts/notification-format

[display-pass]
    appname = ^dis\+
    format = "%s\n%b"
    set_transient = yes
    timeout = 10

[ntfy-default]
appname = ^dis\+ntfy$
frame_color = "#73b8f1"
highlight = "#73b8f1"
format = "<b><span foreground='#73b8f1' >  %s</span></b>\n\n%b"
# }}}

# clipboard: {{{
[clipboard]
category = ntfy-display
summary = clipboard
set_category = "raw.handled"
set_stack_tag = string:x-dunst-stack-tag:clipboard
script = ~/.config/dunst/scripts/clipboard-action

[clipboard-action]
appname = ^dis\+
summary = Clipboard
frame_color = "#73b8f1"
highlight = "#73b8f1"
format = "<b><span foreground='#73b8f1' >󰛈  %s</span></b>\n\n%b"
set_stack_tag = string:x-dunst-stack-tag:clipboard
# }}}

