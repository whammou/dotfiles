# All vimmode bindings are HERE (not in default.conf) so they only exist
# when a matching app is focused.  The keyd-application-mapper applies
# these via `keyd bind reset` on every focus change.
#
# WARNING: The hidden global binding `f24 = toggle(vimmode)` in default.conf is
# used by the KeydIndicator Qtile widget for automatic vimmode toggle
# on focus boundary.
#
# NOTE: leftalt activates the `alt` layer internally (leftalt = layer(alt)),
# so composite layers use `alt+vimmode`, NOT `leftalt+vimmode`.

# LibreOffice {{{
[libreoffice*]

# Toggle vimmode {{{
capslock = toggle(vimmode)
leftalt+capslock = toggle(vimmode)
# }}}

# Nav {{{
vimmode.h = left
vimmode.j = down
vimmode.k = up
vimmode.l = right
vimmode.space = f6
vimmode.x = delete
vimmode.i = toggle(vimmode)
vimmode.u = C-z
vimmode.0 = home
shift+vimmode.4 = end
control+vimmode.h = S-tab
control+vimmode.l = tab
# }}}

# Clipboard {{{
vimmode.y = C-c
vimmode.p = C-v
vimmode.v = toggle(visual)
# }}}

# Alt passthroughs {{{
# Hold leftalt in vimmode to send the raw Alt+KEY to LibreOffice.
alt+vimmode.y = A-y
alt+vimmode.i = A-i
alt+vimmode.e = A-e
alt+vimmode.v = A-v
alt+vimmode.w = A-w
alt+vimmode.space = A-Space
# }}}

# Qtile passthroughs {{{
# so qtile still sees window management bindings (M-x split, M-w
# container, etc.) even when vimmode is active.
meta+vimmode.v = M-v
meta+shift+vimmode.v = M-S-v
meta+vimmode.x = M-x
meta+vimmode.w = M-w
meta+vimmode.i = M-i
meta+vimmode.j = M-j
meta+vimmode.k = M-k
meta+vimmode.h = M-h
meta+vimmode.l = M-l
meta+vimmode.u = M-u
meta+shift+vimmode.0 = M-S-0
meta+shift+vimmode.j = M-S-j
meta+shift+vimmode.k = M-S-k
meta+shift+vimmode.h = M-S-h
meta+control+vimmode.h = M-C-left
meta+control+vimmode.j = M-C-down
meta+control+vimmode.k = M-C-up
meta+control+vimmode.l = M-C-right
#eta+shift+vimmode.l = M-S-l
meta+vimmode.space = M-space
# }}}

# CapsLock {{{
vimmode.capslock = esc
# }}}

# Paging {{{
control+vimmode.d = pagedown
control+vimmode.u = pageup
control+vimmode.f = pagedown
control+vimmode.b = pageup
# }}}

# Zoom {{{
vimmode.minus = C-S-pagedown
shift+vimmode.equal = C-S-pageup
# Non-vimmode fallback (LibreOffice normal mode)
leftcontrol+leftshift+equal = C-S-pageup
leftcontrol+minus = C-S-pagedown
# }}}

# Visual {{{
# Entered via v in vimmode.
visual.h = left
visual.j = down
visual.k = up
visual.l = right
visual.space = f6
visual.w = C-S-right
visual.b = C-S-left
visual.e = C-S-right
visual.y = C-c
visual.x = C-x
visual.esc = toggle(visual)
visual.capslock = toggle(visual)
# v falls through to vimmode.v = toggle(visual) to exit visual mode
control+visual.h = S-tab
control+visual.l = tab
# }}}

# Meta passthroughs {{{
meta+visual.x = M-x
meta+shift+visual.x = M-S-x
meta+visual.v = M-v
meta+visual.w = M-w
meta+shift+visual.v = M-S-v
meta+visual.h = M-h
meta+visual.j = M-j
meta+visual.k = M-k
meta+visual.l = M-l
meta+shift+visual.h = M-S-h
meta+shift+visual.j = M-S-j
meta+shift+visual.k = M-S-k
meta+shift+visual.l = M-S-l
meta+control+visual.h = M-C-h
meta+control+visual.j = M-C-j
meta+control+visual.k = M-C-k
meta+control+visual.l = M-C-l
# }}}

# }}}

# Chromium {{{
[chromium*]

# Toggle vimmode {{{
capslock = toggle(vimmode)
leftalt+capslock = toggle(vimmode)
# }}}

# Nav {{{
vimmode.h = left
vimmode.j = down
vimmode.k = up
vimmode.l = right
vimmode.w = C-right
vimmode.b = C-left
vimmode.e = C-right
vimmode.x = delete
vimmode.i = toggle(vimmode)
vimmode.u = C-z
vimmode.0 = home
shift+vimmode.4 = end
# }}}

# Clipboard {{{
vimmode.y = C-c
vimmode.p = C-v
vimmode.v = toggle(visual)
# }}}

# Qtile passthroughs {{{
meta+vimmode.v = M-v
meta+shift+vimmode.v = M-S-v
meta+vimmode.x = M-x
meta+vimmode.w = M-w
# }}}

# Zoom {{{
vimmode.z = C-equal
# }}}

# CapsLock {{{
vimmode.capslock = esc
# }}}

# Paging {{{
control+vimmode.d = pagedown
control+vimmode.u = pageup
control+vimmode.f = pagedown
control+vimmode.b = pageup
# }}}

# Visual {{{
# Entered via v in vimmode.
visual.h = S-left
visual.j = S-down
visual.k = S-up
visual.l = S-right
visual.y = C-c
visual.x = C-x
visual.esc = toggle(visual)
visual.capslock = toggle(visual)
# v falls through to vimmode.v = toggle(visual) to exit visual mode
# }}}

# Meta passthroughs {{{
meta+visual.x = M-x
meta+shift+visual.x = M-S-x
meta+visual.v = M-v
meta+shift+visual.v = M-S-v
meta+visual.h = M-h
meta+visual.j = M-j
meta+visual.k = M-k
meta+visual.l = M-l
meta+shift+visual.h = M-S-h
meta+shift+visual.j = M-S-j
meta+shift+visual.k = M-S-k
meta+shift+visual.l = M-S-l
meta+control+visual.h = M-C-h
meta+control+visual.j = M-C-j
meta+control+visual.k = M-C-k
meta+control+visual.l = M-C-l
# }}}

# }}}

# Overlays {{{
[rofi]
capslock = esc

[wlr-which-key]
capslock = esc

# Catch-all clears bindings for anything not matched above.
[*]
# }}}

