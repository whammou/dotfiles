# Per-application vimmode configuration.
# All vimmode bindings are HERE (not in default.conf) so they only exist
# when a matching app is focused.  The keyd-application-mapper applies
# these via `keyd bind reset` on every focus change.
#
# The hidden global binding `f24 = toggle(vimmode)` in default.conf is
# used by the KeydIndicator Qtile widget for automatic vimmode toggle
# on focus boundary.
#
# Run `keyd-application-mapper -v` and focus the target window to
# discover its class/app_id.

# ── LibreOffice (all variants: Writer, Calc, Impress, etc.) ────────────
[libreoffice*]

# CapsLock toggles vimmode AND sends Escape (widget forwards Escape via evdev)
capslock = toggle(vimmode)
leftalt+capslock = toggle(vimmode)

# Vim navigation layer
vimmode.h = left
vimmode.j = down
vimmode.k = up
vimmode.l = right
vimmode.w = C-right
vimmode.b = C-left
vimmode.e = C-right
vimmode.x = delete
vimmode.u = C-z
vimmode.i = toggle(vimmode)

# Clipboard operations — keep early, BEFORE shift+vimmode section
vimmode.y = C-c
vimmode.p = C-v
vimmode.v = toggle(visual)

# meta+v / meta+shift+v: macro(M-v) includes meta inside the macro so it
# reaches qtile even though the physical meta is consumed by the binding name.
meta+vimmode.v = macro(M-v)
meta+shift+vimmode.v = macro(M-S-v)

# CapsLock in vimmode sends Escape (closes menus) instead of toggling OFF
vimmode.capslock = esc

# Paging in vimmode+Ctrl
control+vimmode.d = pagedown
control+vimmode.u = pageup
control+vimmode.f = pagedown
control+vimmode.b = pageup

# No text-selection bindings in vimmode — shift reserved for qtile window ops.
# shift+h/j/k/l falls through to vimmode.h = left; Wayland seat aggregation
# combines physical Shift + keyd Left for native Shift+Left selection.

# Zoom — in vimmode, -/+ zoom in/out directly
vimmode.minus = C-S-pagedown
shift+vimmode.equal = C-S-pageup

# Ctrl++ / Ctrl+- fallback for non-vimmode (LibreOffice normal mode)
leftcontrol+leftshift+equal = C-S-pageup
leftcontrol+minus = C-S-pagedown

# ── Visual mode (selection, copy, yank) — entered via v in vimmode ─────
visual.h = S-left
visual.j = S-down
visual.k = S-up
visual.l = S-right
visual.y = C-c
visual.x = C-x
visual.esc = toggle(visual)
visual.capslock = toggle(visual)
# v falls through to vimmode.v = toggle(visual) to exit visual mode
# (no visual.v binding — keyd falls through to vimmode layer)

# Meta-passthroughs: macro(M-KEY) includes meta inside the macro so qtile
# receives the full chord (meta consumed by binding name, forwarded by macro).
meta+visual.x = macro(M-x)
meta+shift+visual.x = macro(M-S-x)
meta+visual.v = macro(M-v)
meta+shift+visual.v = macro(M-S-v)
meta+visual.h = macro(M-h)
meta+visual.j = macro(M-j)
meta+visual.k = macro(M-k)
meta+visual.l = macro(M-l)
meta+shift+visual.h = macro(M-S-h)
meta+shift+visual.j = macro(M-S-j)
meta+shift+visual.k = macro(M-S-k)
meta+shift+visual.l = macro(M-S-l)
meta+control+visual.h = macro(M-C-h)
meta+control+visual.j = macro(M-C-j)
meta+control+visual.k = macro(M-C-k)
meta+control+visual.l = macro(M-C-l)

# ── Chromium / Chrome / Brave / Edge (all Chromium-based browsers) ─────
[chromium*]

# CapsLock toggles vimmode AND sends Escape (widget forwards Escape via evdev)
capslock = toggle(vimmode)
leftalt+capslock = toggle(vimmode)

vimmode.h = left
vimmode.j = down
vimmode.k = up
vimmode.l = right
vimmode.w = C-right
vimmode.b = C-left
vimmode.e = C-right
vimmode.x = delete
vimmode.u = C-z
vimmode.i = toggle(vimmode)

# No text-selection bindings in vimmode — shift reserved for qtile window ops.

# Clipboard operations in normal mode
vimmode.y = C-c
vimmode.p = C-v
vimmode.v = toggle(visual)

# meta+v / meta+shift+v: forward full chord to qtile via macro
meta+vimmode.v = macro(M-v)
meta+shift+vimmode.v = macro(M-S-v)

# Zoom in/out (Ctrl+= / Ctrl+-)
vimmode.z = C-equal

# ── Visual mode (selection, copy, yank) — entered via v in vimmode ─────
visual.h = S-left
visual.j = S-down
visual.k = S-up
visual.l = S-right
visual.y = C-c
visual.x = C-x
visual.esc = toggle(visual)
visual.capslock = toggle(visual)
 # v falls through to vimmode.v = toggle(visual) to exit visual mode
# (no visual.v binding — keyd falls through to vimmode layer)

# Meta-passthroughs: macro(M-KEY) includes meta inside the macro so qtile
# receives the full chord (meta consumed by binding name, forwarded by macro).
meta+visual.x = macro(M-x)
meta+shift+visual.x = macro(M-S-x)
meta+visual.v = macro(M-v)
meta+shift+visual.v = macro(M-S-v)
meta+visual.h = macro(M-h)
meta+visual.j = macro(M-j)
meta+visual.k = macro(M-k)
meta+visual.l = macro(M-l)
meta+shift+visual.h = macro(M-S-h)
meta+shift+visual.j = macro(M-S-j)
meta+shift+visual.k = macro(M-S-k)
meta+shift+visual.l = macro(M-S-l)
meta+control+visual.h = macro(M-C-h)
meta+control+visual.j = macro(M-C-j)
meta+control+visual.k = macro(M-C-k)
meta+control+visual.l = macro(M-C-l)

# CapsLock in vimmode sends Escape (closes menus) instead of toggling OFF
vimmode.capslock = esc

# Paging in vimmode+Ctrl
control+vimmode.d = pagedown
control+vimmode.u = pageup
control+vimmode.f = pagedown
control+vimmode.b = pageup

# ── Overlays — never vimmode, but CapsLock still sends ESC ─────────────
[rofi]
capslock = esc

[wlr-which-key]
capslock = esc

# Catch-all clears bindings for anything not matched above.
[*]
