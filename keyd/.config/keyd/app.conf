# Per-application vimmode configuration.
# All vimmode bindings are HERE (not in default.conf) so they only exist
# when a matching app is focused.  The keyd-application-mapper applies
# these via `keyd bind reset` on every focus change.
#
# The hidden global binding `f24 = toggle(vimmode)` in default.conf is
# used by the KeydIndicator Qtile widget for automatic vimmode toggle
# on focus boundary.
#
# Run `keyd-application-mapper -v` and focus the target window to
# discover its class/app_id.
#
# NOTE: leftalt activates the `alt` layer internally (leftalt = layer(alt)),
# so composite layers use `alt+vimmode`, NOT `leftalt+vimmode`.

# category {{{ LibreOffice (all variants: Writer, Calc, Impress, etc.)
[libreoffice*]

# category {{{ Toggle vimmode
capslock = toggle(vimmode)
leftalt+capslock = toggle(vimmode)
# }}} Toggle vimmode

# category {{{ Core vim navigation
vimmode.h = left
vimmode.j = down
vimmode.k = up
vimmode.l = right
vimmode.space = f6
vimmode.w = C-right
vimmode.b = C-left
vimmode.e = C-right
vimmode.x = delete
vimmode.i = toggle(vimmode)
vimmode.u = C-z
vimmode.0 = home
shift+vimmode.4 = end
shift+vimmode.h = S-tab
shift+vimmode.l = tab
# }}} Core vim navigation

# category {{{ Clipboard (yank/paste/visual toggle)
vimmode.y = C-c
vimmode.p = C-v
vimmode.v = toggle(visual)
# }}} Clipboard

# category {{{ Alt passthroughs (LibreOffice native Alt shortcuts)
# Hold leftalt in vimmode to send the raw Alt+KEY to LibreOffice.
alt+vimmode.y = A-y
alt+vimmode.i = A-i
alt+vimmode.e = A-e
alt+vimmode.v = A-v
alt+vimmode.w = A-w
# }}} Alt passthroughs

# category {{{ Qtile passthroughs: meta+letter forwards full chord
# so qtile still sees window management bindings (M-x split, M-w
# container, etc.) even when vimmode is active.
meta+vimmode.v = macro(M-v)
meta+shift+vimmode.v = macro(M-S-v)
meta+vimmode.x = macro(M-x)
meta+vimmode.w = macro(M-w)
meta+vimmode.i = macro(M-i)
meta+vimmode.j = macro(M-j)
meta+vimmode.k = macro(M-k)
meta+vimmode.h = macro(M-h)
meta+vimmode.l = macro(M-l)
meta+vimmode.u = macro(M-u)
meta+shift+vimmode.0 = macro(M-S-0)
meta+shift+vimmode.j = macro(M-S-j)
meta+shift+vimmode.k = macro(M-S-k)
meta+shift+vimmode.h = macro(M-S-h)
meta+shift+vimmode.l = macro(M-S-l)
# }}} Qtile passthroughs

# category {{{ CapsLock in vimmode sends Escape (closes menus)
vimmode.capslock = esc
# }}} CapsLock escape

# category {{{ Paging in vimmode
control+vimmode.d = pagedown
control+vimmode.u = pageup
control+vimmode.f = pagedown
control+vimmode.b = pageup
# }}} Paging

# category {{{ Zoom
vimmode.minus = C-S-pagedown
shift+vimmode.equal = C-S-pageup
# Non-vimmode fallback (LibreOffice normal mode)
leftcontrol+leftshift+equal = C-S-pageup
leftcontrol+minus = C-S-pagedown
# }}} Zoom

# category {{{ Visual mode (selection, copy, yank)
# Entered via v in vimmode.
visual.h = S-left
visual.j = S-down
visual.k = S-up
visual.l = S-right
visual.space = f6
visual.y = C-c
visual.x = C-x
visual.esc = toggle(visual)
visual.capslock = toggle(visual)
# v falls through to vimmode.v = toggle(visual) to exit visual mode
shift+visual.h = S-tab
shift+visual.l = tab
# }}} Visual mode

# category {{{ Meta passthroughs in visual mode
meta+visual.x = macro(M-x)
meta+shift+visual.x = macro(M-S-x)
meta+visual.v = macro(M-v)
meta+visual.w = macro(M-w)
meta+shift+visual.v = macro(M-S-v)
meta+visual.h = macro(M-h)
meta+visual.j = macro(M-j)
meta+visual.k = macro(M-k)
meta+visual.l = macro(M-l)
meta+shift+visual.h = macro(M-S-h)
meta+shift+visual.j = macro(M-S-j)
meta+shift+visual.k = macro(M-S-k)
meta+shift+visual.l = macro(M-S-l)
meta+control+visual.h = macro(M-C-h)
meta+control+visual.j = macro(M-C-j)
meta+control+visual.k = macro(M-C-k)
meta+control+visual.l = macro(M-C-l)
# }}} Meta passthroughs in visual mode

# }}} LibreOffice

# category {{{ Chromium (Chrome, Brave, Edge, all Chromium-based)
[chromium*]

# category {{{ Toggle vimmode
capslock = toggle(vimmode)
leftalt+capslock = toggle(vimmode)
# }}} Toggle vimmode

# category {{{ Core vim navigation
vimmode.h = left
vimmode.j = down
vimmode.k = up
vimmode.l = right
vimmode.w = C-right
vimmode.b = C-left
vimmode.e = C-right
vimmode.x = delete
vimmode.i = toggle(vimmode)
vimmode.u = C-z
vimmode.0 = home
shift+vimmode.4 = end
# }}} Core vim navigation

# category {{{ Clipboard (yank/paste/visual toggle)
vimmode.y = C-c
vimmode.p = C-v
vimmode.v = toggle(visual)
# }}} Clipboard

# category {{{ Qtile passthroughs
meta+vimmode.v = macro(M-v)
meta+shift+vimmode.v = macro(M-S-v)
meta+vimmode.x = macro(M-x)
meta+vimmode.w = macro(M-w)
# }}} Qtile passthroughs

# category {{{ Zoom
vimmode.z = C-equal
# }}} Zoom

# category {{{ CapsLock in vimmode sends Escape
vimmode.capslock = esc
# }}} CapsLock escape

# category {{{ Paging in vimmode
control+vimmode.d = pagedown
control+vimmode.u = pageup
control+vimmode.f = pagedown
control+vimmode.b = pageup
# }}} Paging

# category {{{ Visual mode (selection, copy, yank)
# Entered via v in vimmode.
visual.h = S-left
visual.j = S-down
visual.k = S-up
visual.l = S-right
visual.y = C-c
visual.x = C-x
visual.esc = toggle(visual)
visual.capslock = toggle(visual)
# v falls through to vimmode.v = toggle(visual) to exit visual mode
# }}} Visual mode

# category {{{ Meta passthroughs in visual mode
meta+visual.x = macro(M-x)
meta+shift+visual.x = macro(M-S-x)
meta+visual.v = macro(M-v)
meta+shift+visual.v = macro(M-S-v)
meta+visual.h = macro(M-h)
meta+visual.j = macro(M-j)
meta+visual.k = macro(M-k)
meta+visual.l = macro(M-l)
meta+shift+visual.h = macro(M-S-h)
meta+shift+visual.j = macro(M-S-j)
meta+shift+visual.k = macro(M-S-k)
meta+shift+visual.l = macro(M-S-l)
meta+control+visual.h = macro(M-C-h)
meta+control+visual.j = macro(M-C-j)
meta+control+visual.k = macro(M-C-k)
meta+control+visual.l = macro(M-C-l)
# }}} Meta passthroughs in visual mode

# }}} Chromium

# category {{{ Overlays (never vimmode, CapsLock sends ESC)
[rofi]
capslock = esc

[wlr-which-key]
capslock = esc

# Catch-all clears bindings for anything not matched above.
[*]
# }}} Overlays

# vim:foldmethod=marker foldlevel=0
