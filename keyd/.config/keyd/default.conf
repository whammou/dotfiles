[ids]
*

# ── Qtile-managed keys (DO NOT BIND HERE) ──────────────────────────────
# These keys are claimed by the qtile compositor for window management.
# Binding them in keyd's global scope will intercept them before qtile
# ever sees them, breaking the associated operation.
#
# Letter keys (under mod4):
#   h/j/k/l — move floating window (M-h/j/k/l)
#           — resize (M-C-h/j/k/l)
#           — swap (M-S-h/j/k/l)
#   m        — keep below (M-m)
#   z        — fullscreen (M-z / M-S-z)
#   q        — kill (M-q)
#   o, i     — container select (M-o / M-i)
#   s        — spawn wlr-which-key (M-s)
#   f        — spawn float (M-f)
#   v        — split right (M-v)
#   x        — split below (M-x)
#   t        — spawn tab (M-t)
#   n        — normalize (M-n / M-S-n)
#   r        — reload / run (M-r / M-C-r)
#   w        — container chord (M-w → h/j/k/l/v/x/t/o/u + sub-chords)
#   period   — focus next floating (M-.)
#   comma    — focus prev floating (M-, / M-S-,)
#   Tab      — focus back / scratchpad (M-<Tab>)
#   Escape   — scratchpad / toggle (M-<Escape> / M-C-<Escape>)
#   Space    — toggle trackpoint (M-Space / M-S-Space)
#   Home     — notification history (M-Home / M-S-Home)
#   End      — notification close (M-End / M-C-End / M-S-End)
#
# Functional keys: XF86Audio*, XF86MonBrightness*, Print,
#                  XF86Display, XF86Tools, XF86Search, etc.
#                  → all bound in qtile: functional.py
# ────────────────────────────────────────────────────────────────────────

[main]
capslock = esc
esc = capslock
rightalt = layer(nav)

# F23 — injected by widget to send Escape without keyd re-remapping it.
f23 = esc

# Hidden toggle — F24 doesn't exist on any physical keyboard.
# The KeydIndicator Qtile widget uses ydotool to simulate F24 for
# automatic vimmode enable/disable on focus boundary.
f24 = toggle(vimmode)

[nav]
h = left
j = down
k = up
l = right

# Layer stubs — must exist so keyd accepts vimmode / modifier+vimmode
# bindings from keyd-application-mapper.
# Must exist for app.conf vimmode bindings (keyd-application-mapper) to load.
[vimmode]

# Composite-layer stubs — required for app.conf to add bindings.
# leftalt → layer(alt) internally, so [alt+vimmode] not [leftalt+vimmode].
[control+vimmode]

[alt+vimmode]

[shift+vimmode]

[meta+vimmode]

[meta+shift+vimmode]

[meta+control+vimmode]

# Must exist for app.conf visual bindings.
[visual]

# Visual mode composite-layer stubs.
[meta+visual]

[meta+shift+visual]

[meta+control+visual]
