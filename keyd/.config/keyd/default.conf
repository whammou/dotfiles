[ids]
*

[main]
# Super alone → wlr-which-key (Qtile binds the resulting keysym as bare
# XF86Tools in qtile/.config/qtile/settings/keys.py — xkb maps KEY_F13 to
# XF86Tools, not F13). Repeat disabled so holding Super fires once.
leftmeta = macro2(0, 0, f13)
# rightmeta = macro2(0, 0, f13)

# caps:swapescape (moved from qtile wl_input_rules kb_options)
capslock = esc
esc = capslock

# L-Ctrl nav (moved from xkb qtile-ralt-nav, RAlt→RCtrl→LCtrl):
# hold lctrl → nav for h/j/k/l/d/u, Control preserved for all other
# keys (man page pattern: extending [control] merges with the implicit
# control:C layer). Direct `leftcontrol = overload(...)` is rejected by
# `keyd check`, this form validates clean. Tap lctrl alone = bare
# Control (no-op in apps), same as stock behavior.
[control]
h = left
j = down
k = up
l = right
# d = pagedown
# u = pageup

# Ctrl+mods+hjkl → letters+mods (not arrows+mods). Composites take
# precedence when all constituents are held; unlisted keys pass through
# with mods intact. Must stay after [control] (composites defined after
# constituents). d/u omitted to match [control] above.
[control+shift]
h = C-S-h
j = C-S-j
k = C-S-k
l = C-S-l

[control+alt]
h = C-A-h
j = C-A-j
k = C-A-k
l = C-A-l

[control+meta]
h = C-M-h
j = C-M-j
k = C-M-k
l = C-M-l

[control+shift+alt]
h = C-S-A-h
j = C-S-A-j
k = C-S-A-k
l = C-S-A-l
