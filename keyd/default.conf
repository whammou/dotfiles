[ids]
*

[main]
capslock = esc
esc = capslock
rightalt = layer(nav)

# F23 — injected by widget to send Escape without keyd re-remapping it.
f23 = esc

# Hidden toggle — F24 doesn't exist on any physical keyboard.
# The KeydIndicator Qtile widget uses ydotool to simulate F24 for
# automatic vimmode enable/disable on focus boundary.
f24 = toggle(vimmode)

[nav]
h = left
j = down
k = up
l = right

# Layer stubs — must exist so keyd accepts vimmode. bindings in keyd bind.
# Actual per-app bindings come from app.conf via keyd-application-mapper.
[vimmode]

[control+vimmode]
