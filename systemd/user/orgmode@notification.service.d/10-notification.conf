[Unit]
# A per-minute oneshot trips the template's crash-loop limit; the timer itself
# is the throttle, and a failing notifier should not dunstify every minute.
StartLimitIntervalSec=0

[Service]
Type=oneshot
Restart=no
Environment=DISPLAY=:0
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
