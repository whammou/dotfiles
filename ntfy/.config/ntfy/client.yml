# ntfy client config file

# Base URL used to expand short topic names in the "ntfy publish" and "ntfy subscribe" commands.
# If you self-host a ntfy server, you'll likely want to change this.
#
default-host: "https://ntfy.whammou.dedyn.io"

# Default credentials will be used with "ntfy publish" and "ntfy subscribe" if no other credentials are provided.
# You can set a default token to use or a default user:password combination, but not both. For an empty password,
# use empty double-quotes ("").
#
# To override the default user:password combination or default token for a particular subscription (e.g., to send
# no Authorization header), set the user:pass/token for the subscription to empty double-quotes ("").

# default-token:

default-user: "whammou"
default-password: "Unlimitednova199-"

# Variables:
#     Variable        Aliases               Description
#     --------------- --------------------- -----------------------------------
#     $NTFY_ID        $id                   Unique message ID
#     $NTFY_TIME      $time                 Unix timestamp of the message delivery
#     $NTFY_TOPIC     $topic                Topic name
#     $NTFY_MESSAGE   $message, $m          Message body
#     $NTFY_TITLE     $title, $t            Message title
#     $NTFY_PRIORITY  $priority, $prio, $p  Message priority (1=min, 5=max)
#     $NTFY_TAGS      $tags, $tag, $ta      Message tags (comma separated list)
#     $NTFY_RAW       $raw                  Raw JSON message
#
# Filters ('if:'):
#     You can filter 'message', 'title', 'priority' (comma-separated list, logical OR)
#     and 'tags' (comma-separated list, logical AND). See https://ntfy.sh/docs/subscribe/api/#filter-messages.
#

subscribe:
  # High priority alerts - critical urgency, persistent

  # OpenCode notifications - normal urgency
  - topic: opencode
    command: |
      case "$priority" in
        5|4) urgency="critical" ;;
        3)   urgency="normal" ;;
        *)   urgency="low" ;;
      esac
      dunstify -a "ntfy" -u "$urgency" "$title" "$message"

  # Android notifications - map priority to urgency
  - topic: android-notifications
    command: |
      case "$priority" in
        5|4) urgency="critical" ;;
        3)   urgency="normal" ;;
        *)   urgency="low" ;;
      esac
      dunstify -a "ntfy" -u "$urgency" "$title" "$message"

  # OrgMode - low urgency, transient
  - topic: orgmode
    command: |
      case "$priority" in
        5|4) urgency="critical" ;;
        3)   urgency="normal" ;;
        *)   urgency="low" ;;
      esac
      dunstify -a "ntfy" -u "$urgency" "$title" "$message"

  # Actions - with icon based on tags
  - topic: actions
    command: |
      case "$tags" in
        *play*)   icon="media-play" ;;
        *stop*)   icon="media-stop" ;;
        *wifi*)   icon="network-wireless" ;;
        *error*)  icon="dialog-error" ;;
        *)        icon="dialog-information" ;;
      esac
      dunstify -a "ntfy" -i "$icon" "$title" "$message"

  # draobpilc - normal urgency
  - topic: draobpilc
    command: |
      case "$priority" in
        5|4) urgency="critical" ;;
        3)   urgency="normal" ;;
        *)   urgency="low" ;;
      esac
      dunstify -a "ntfy" -u "$urgency" "$title" "$message"
