[[handlers]]
exec = "handlr launch .docx %u"
terminal = false
regexes = [
  'https?:\/\/[^\s]+\.(abw|csv|dbf|dif|djvu|doc|docm|docx|dot|dotm|dotx|epub|fodg|fodp|fods|fodt|gnumeric|htm|html|json|mml|mobi|odf|odg|odm|odp|ods|odt|otg|oth|otp|ots|ott|oxt|pot|potm|potx|ppsx|ppt|pptm|pptx|rtf|slk|sxc|sxi|t602|tsv|txt|typ|uos|uot|uof|wpd|xls|xlsb|xlsm|xlsx|xlt|xltm|xltx|xml|pdf)(?:\?[^\s]*)?(?:\#[^\s]*)?$',
  'file:\/\/[^\s]+\.(abw|csv|dbf|dif|djvu|doc|docm|docx|dot|dotm|dotx|epub|fodg|fodp|fods|fodt|gnumeric|htm|html|json|mml|mobi|odf|odg|odm|odp|ods|odt|otg|oth|otp|ots|ott|oxt|pot|potm|potx|ppsx|ppt|pptm|pptx|rtf|slk|sxc|sxi|t602|tsv|txt|typ|uos|uot|uof|wpd|xls|xlsb|xlsm|xlsx|xlt|xltm|xltx|xml|pdf)(?:\?[^\s]*)?(?:\#[^\s]*)?$',
  '^\/.*\.(abw|csv|dbf|dif|djvu|doc|docm|docx|dot|dotm|dotx|epub|fodg|fodp|fods|fodt|gnumeric|htm|html|json|mml|mobi|odf|odg|odm|odp|ods|odt|otg|oth|otp|ots|ott|oxt|pot|potm|potx|ppsx|ppt|pptm|pptx|rtf|slk|sxc|sxi|t602|tsv|txt|typ|uos|uot|uof|wpd|xls|xlsb|xlsm|xlsx|xlt|xltm|xltx|xml|pdf)(?:\?[^\s]*)?(?:\#[^\s]*)?$',
]
