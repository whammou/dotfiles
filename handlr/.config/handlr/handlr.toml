enable_selector = true
selector = "rofi -dmenu -i -p 'Open with: '"
term_exec_args = ""
expand_wildcards = true

[[handlers]]
exec = "mpv --profile=image %u"
terminal = false
regexes = [
  'https?:\/\/[^\s\/$.?#].[^\s]*\.(?:png|jpe?g|gif|svg|webp|bmp|tiff|svg)$'
]

[[handlers]]
exec = "handlr launch .mkv %u"
terminal = false
regexes = ['https?:\/\/[^\s\/$.?#].[^\s]*\.(?:mp4|mkv)$']

[[handlers]]
exec = "nvim %u"
terminal = true
regexes = ['scp?:\/\/[^\s\/$.?#].[^\s]*']

[[handlers]]
exec = 'sh -c "exec nvim \"$(echo \"$1\" | sed \"s,https://,davs://,\")\"" sh %u'
terminal = true
regexes = ['^https://[^\s/]+/.*\.org(?:\?[^\s]*)?(?:\#[^\s]*)?$']

